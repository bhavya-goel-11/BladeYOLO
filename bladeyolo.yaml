# BladeYOLO Configuration (Base: YOLOv12-L structure)
# Reconstructed for IEEE TGRS 2026 paper

nc: 80 # default to COCO, automatically overridden by WindSurface-Defect/data.yaml
scales:
  l: [1.0, 1.0, 512]

backbone:
  # [from, repeats, module, args]
  # BladeYOLOBackbone outputs a list of 3 tensors: [F3_enh, F4_enh, F5]
  - [-1, 1, BladeYOLOBackbone, []]  # 0
  
  # Extract multiscale features (P3, P4, P5)
  - [0, 1, GhostConv, [256, 0]]      # 1: P3 (stride 8)
  - [0, 1, GhostConv, [512, 1]]      # 2: P4 (stride 16)
  - [0, 1, GhostConv, [512, 2]]      # 3: P5 (stride 32) (max_channels is 512 for YOLOv12-L)

head:
  # YOLOv12 PAFPN Neck adapting the enhanced multiscale features
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 4
  - [[-1, 2], 1, Concat, [1]]                  # 5 (concat with P4)
  - [-1, 2, A2C2f, [512, False, -1]]           # 6

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 7
  - [[-1, 1], 1, Concat, [1]]                  # 8 (concat with P3)
  - [-1, 2, A2C2f, [256, False, -1]]           # 9 (P3 out)

  - [-1, 1, Conv, [256, 3, 2]]                 # 10
  - [[-1, 6], 1, Concat, [1]]                  # 11 (concat with neck P4)
  - [-1, 2, A2C2f, [512, False, -1]]           # 12 (P4 out)

  - [-1, 1, Conv, [512, 3, 2]]                 # 13
  - [[-1, 3], 1, Concat, [1]]                  # 14 (concat with backbone P5)
  - [-1, 2, C3k2, [1024, True]]                # 15 (P5 out)

  - [[9, 12, 15], 1, Detect, [nc]]             # 16
