# BladeYOLO Configuration (Base: YOLOv12-L equivalent structure)
# Reconstructed for IEEE TGRS 2026 paper

nc: 80 # default to COCO, automatically overridden by WindSurface-Defect/data.yaml
scales:
  l: [1.0, 1.0, 1024]

backbone:
  # [from, repeats, module, args]
  # BladeYOLOBackbone outputs a list of 3 tensors: [F3_enh, F4_enh, F5]
  - [-1, 1, BladeYOLOBackbone, []]  # 0
  
  # Extract multiscale features (P3, P4, P5)
  # NOTE: We use GhostConv here as a proxy module to trick the Ultralytics 
  # channel inference engine. In train.py, GhostConv is monkey-patched 
  # to act as a list index extractor.
  - [0, 1, GhostConv, [256, 0]]      # 1: P3 (stride 8)
  - [0, 1, GhostConv, [512, 1]]      # 2: P4 (stride 16)
  - [0, 1, GhostConv, [1024, 2]]     # 3: P5 (stride 32)

head:
  # PAFPN Neck adapting the enhanced multiscale features
  - [3, 1, Conv, [512, 1, 1]]                  # 4 (from P5)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 5
  - [[-1, 2], 1, Concat, [1]]                  # 6 (concat with P4)
  - [-1, 3, C2f, [512]]                        # 7

  - [-1, 1, Conv, [256, 1, 1]]                 # 8
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 9
  - [[-1, 1], 1, Concat, [1]]                  # 10 (concat with P3)
  - [-1, 3, C2f, [256]]                        # 11 (P3 out)

  - [-1, 1, Conv, [256, 3, 2]]                 # 12
  - [[-1, 8], 1, Concat, [1]]                  # 13
  - [-1, 3, C2f, [512]]                        # 14 (P4 out)

  - [-1, 1, Conv, [512, 3, 2]]                 # 15
  - [[-1, 4], 1, Concat, [1]]                  # 16
  - [-1, 3, C2f, [1024]]                       # 17 (P5 out)

  - [[11, 14, 17], 1, Detect, [nc]]            # 18
